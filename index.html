
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฟอร์มเสนอสินค้าใหม่ | Union Thai-Nichiban</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <main class="page-container">
    <section class="form-card">

      <header class="form-header">
        <div class="company-name">UNION THAI-NICHIBAN</div>
        <h1>แบบฟอร์มเสนอสินค้าใหม่</h1>
        <p>กรุณากรอกข้อมูลสินค้าให้ครบถ้วน</p>
      </header>

      <form id="productForm">

        <div class="form-group">
          <label for="fullName">ชื่อ-นามสกุล <span class="required">*</span></label>
          <input type="text" id="fullName" name="fullName"
            placeholder="กรอกชื่อ-นามสกุล" required maxlength="150">
        </div>

        <div class="form-group">
          <label for="department">แผนก <span class="required">*</span></label>
          <input type="text" id="department" name="department"
            placeholder="กรอกชื่อแผนก" required maxlength="150">
        </div>

        <div class="form-group">
          <label for="productName">ชื่อสินค้า <span class="required">*</span></label>
          <input type="text" id="productName" name="productName"
            placeholder="กรอกชื่อสินค้าที่ต้องการเสนอ"
            maxlength="200" autocomplete="off"
            aria-describedby="productNameError" required>
          <small class="hint">ระบบจะตรวจสอบชื่อสินค้าซ้ำก่อนบันทึกข้อมูล</small>
          <small id="productNameError" class="field-error"
            role="alert" hidden></small>
        </div>

        <div class="form-group">
          <label for="targetCustomer">ลูกค้าเป้าหมาย <span class="required">*</span></label>
          <input type="text" id="targetCustomer" name="targetCustomer"
            placeholder="กรอกชื่อลูกค้าเป้าหมาย" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="usageDetails">รายละเอียดการใช้งาน <span class="required">*</span></label>
          <textarea id="usageDetails" name="usageDetails"
            placeholder="อธิบายรายละเอียดหรือวัตถุประสงค์การใช้งาน"
            rows="4" required maxlength="2000"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span id="submitText">ส่งข้อมูล</span>
        </button>

      </form>

      <footer class="form-footer">
        Union Thai-Nichiban Co., Ltd.
      </footer>

    </section>
  </main>

  <!-- Popup แจ้งผลการทำงาน -->
  <div id="status" class="status" role="alertdialog"
    aria-modal="true" aria-labelledby="popupTitle"
    aria-describedby="popupMessage" aria-hidden="true" hidden>

    <div class="popup-card">
      <div id="popupIcon" class="popup-icon" aria-hidden="true">✓</div>
      <h2 id="popupTitle">แจ้งเตือน</h2>
      <p id="popupMessage"></p>
      <button type="button" id="popupClose" class="popup-close">
        ตกลง
      </button>
    </div>

  </div>

  <script src="./script.js"></script>
</body>
</html>
