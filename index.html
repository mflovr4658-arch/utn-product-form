
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฟอร์มเสนอสินค้าใหม่ | Union Thai-Nichiban</title>
  <link rel="stylesheet" href="./styles.css">
  
</head>
<body>
  <main class="container">

    <header class="header">
      <div class="logo">UTN</div>
      <h1>แบบฟอร์มเสนอสินค้าใหม่</h1>
      <p>กรุณากรอกข้อมูลให้ครบถ้วนเพื่อเสนอชื่อสินค้าใหม่</p>
    </header>

    <form id="productForm">

      <div class="form-group">
        <label for="fullName">ชื่อ - นามสกุล <span class="required">*</span></label>
        <input type="text" id="fullName" name="fullName"
          placeholder="กรอกชื่อและนามสกุล" maxlength="150" required>
      </div>

      <div class="form-group">
        <label for="department">แผนก <span class="required">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- เลือกแผนก --</option>
          <option value="บุคคล">บุคคล</option>
          <option value="หน่วยงานความปลอดภัย">หน่วยงานความปลอดภัย</option>
          <option value="บัญชี">บัญชี</option>
          <option value="การเงิน">การเงิน</option>
          <option value="การตลาด">การตลาด</option>
          <option value="จัดซื้อ">จัดซื้อ</option>
          <option value="คลังสำเร็จรูป">คลังสำเร็จรูป</option>
          <option value="คลังวัตถุดิบ">คลังวัตถุดิบ</option>
          <option value="วางแผนผลิต">วางแผนผลิต</option>
          <option value="ธุรการขายต่างประเทศ">ธุรการขายต่างประเทศ</option>
          <option value="ขาย">ขาย</option>
          <option value="บริหารคุณภาพ">บริหารคุณภาพ</option>
          <option value="ควบคุมคุณภาพ">ควบคุมคุณภาพ</option>
          <option value="ซ่อมบำรุง">ซ่อมบำรุง</option>
          <option value="ส่วนผลิต">ส่วนผลิต</option>
          <option value="มิกซ์ซิ่ง">มิกซ์ซิ่ง</option>
          <option value="โค๊ดติ่ง">โค๊ดติ่ง</option>
          <option value="สลิตติ่ง">สลิตติ่ง</option>
          <option value="แพ็คกิ้ง">แพ็คกิ้ง</option>
          <option value="สไลด์">สไลด์</option>
          <option value="แกนกระดาษ">แกนกระดาษ</option>
          <option value="วางแผนกลยุทธ์">วางแผนกลยุทธ์</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>

      <div class="form-group">
        <label for="productName">ชื่อสินค้า <span class="required">*</span></label>
        <input type="text" id="productName" name="productName"
          placeholder="กรอกชื่อสินค้าที่ต้องการเสนอ"
          maxlength="200" required>
        <small class="hint">ระบบจะตรวจสอบชื่อสินค้าซ้ำก่อนบันทึกข้อมูล</small>
      </div>

      <div class="form-group">
        <label for="targetCustomer">ลูกค้าเป้าหมาย <span class="required">*</span></label>
        <textarea id="targetCustomer" name="targetCustomer"
          placeholder="ระบุกลุ่มลูกค้าเป้าหมายของสินค้า"
          rows="5" maxlength="2000" required></textarea>
      </div>

      <div class="form-group">
        <label for="usageDetails">รายละเอียดการใช้งาน <span class="required">*</span></label>
        <textarea id="usageDetails" name="usageDetails"
          placeholder="อธิบายรายละเอียดการใช้งานของสินค้า"
          rows="5" maxlength="2000" required></textarea>
      </div>

      
<!-- POPUP NOTIFICATION -->
<div
  id="status"
  class="status"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="popupTitle"
  aria-describedby="popupMessage"
  aria-live="assertive"
  style="display: none;"
>
  <div class="popup-card">
    <div id="popupIcon" class="popup-icon">✓</div>

    <div class="popup-content">
      <h2 id="popupTitle">แจ้งเตือน</h2>
      <p id="popupMessage"></p>
    </div>

    <button
      type="button"
      id="popupClose"
      class="popup-close"
    >
      ตกลง
    </button>
  </div>
</div>
<!-- END POPUP NOTIFICATION -->

     

      <button type="submit" id="submitBtn">ส่งข้อมูล</button>

    </form>

    <footer class="footer">
      UNION THAI-NICHIBAN CO., LTD.
    </footer>

  </main>

  <script src="./script.js"></script>
</body>
</html>
