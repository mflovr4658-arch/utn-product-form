
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>แบบฟอร์มเสนอสินค้าใหม่ | Union Thai-Nichiban</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- =================================
       หน้าแรก
  ================================== -->
  <section id="welcomePage" class="welcome-page">
    <div class="welcome-container">

      <img
        src="./images/welcome.jpg"
        alt="Union Thai-Nichiban"
        class="welcome-image"
      >

      <button
        type="button"
        id="enterFormBtn"
        class="enter-form-btn"
      >
        เข้าสู่แบบฟอร์ม
      </button>

    </div>
  </section>


  <!-- =================================
       หน้าแบบฟอร์มเสนอสินค้าใหม่
  ================================== -->
  <main id="formPage" class="page-container" hidden>

    <section class="form-card">

      <header class="form-header">
        <div class="company-name">UNION THAI-NICHIBAN</div>
        <h1>แบบฟอร์มเสนอสินค้าใหม่</h1>
        <p>กรุณากรอกข้อมูลให้ครบถ้วนก่อนส่งแบบฟอร์ม</p>
      </header>


      <form id="productForm">

        <!-- ชื่อ-นามสกุล -->
        <div class="form-group">

          <label for="fullName">
            ชื่อ-นามสกุล <span class="required">*</span>
          </label>

          <small class="hint">
            หมายเหตุ: กรอกชื่อ-นามสกุล ระบบจะค้นหาและเติมรหัสพนักงานกับแผนกให้อัตโนมัติ
          </small>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="กรอกชื่อ-นามสกุลเต็ม"
            maxlength="150"
            autocomplete="name"
            aria-describedby="fullNameError"
            required
          >

          <small
            id="fullNameError"
            class="field-error"
            role="alert"
            hidden
          ></small>

        </div>


        <!-- รหัสพนักงาน -->
        <div class="form-group">

          <label for="employeeID">
            รหัสพนักงาน
          </label>

          <input
            type="text"
            id="employeeID"
            name="employeeID"
            placeholder="ระบบจะแสดงรหัสพนักงานอัตโนมัติ"
            maxlength="30"
            autocomplete="off"
            readonly
            aria-readonly="true"
          >

          <small
            id="employeeIDError"
            class="field-error"
            role="alert"
            hidden
          ></small>

        </div>


        <!-- แผนก -->
        <div class="form-group">

          <label for="department">
            แผนก
          </label>

          <input
            type="text"
            id="department"
            name="department"
            placeholder="ระบบจะแสดงแผนกอัตโนมัติ"
            readonly
            aria-readonly="true"
          >

          <small class="hint">
            ระบบจะดึงข้อมูลแผนกจากฐานข้อมูลพนักงาน
          </small>

        </div>


        <!-- ชื่อสินค้า -->
        <div class="form-group">

          <label for="productName">
            ชื่อสินค้า <span class="required">*</span>
          </label>

          <input
            type="text"
            id="productName"
            name="productName"
            placeholder="กรอกชื่อสินค้าที่ต้องการเสนอ"
            maxlength="200"
            autocomplete="off"
            aria-describedby="productNameError"
            required
          >

          <small class="hint">
            ระบบจะตรวจสอบชื่อสินค้าซ้ำก่อนบันทึกข้อมูล
          </small>

          <small
            id="productNameError"
            class="field-error"
            role="alert"
            hidden
          ></small>

        </div>


        <!-- ลูกค้าเป้าหมาย -->
        <div class="form-group">

          <label for="targetCustomer">
            ลูกค้าเป้าหมาย <span class="required">*</span>
          </label>

          <input
            type="text"
            id="targetCustomer"
            name="targetCustomer"
            placeholder="กรอกชื่อลูกค้าเป้าหมาย"
            maxlength="200"
            required
          >

        </div>


        <!-- รายละเอียดการใช้งาน -->
        <div class="form-group">

          <label for="usageDetails">
            รายละเอียดการใช้งาน <span class="required">*</span>
          </label>

          <textarea
            id="usageDetails"
            name="usageDetails"
            placeholder="อธิบายรายละเอียดหรือวัตถุประสงค์การใช้งาน"
            rows="4"
            maxlength="2000"
            required
          ></textarea>

        </div>


        <!-- ปุ่มส่งข้อมูล -->
        <button
          type="submit"
          id="submitBtn"
          class="submit-btn"
        >
          <span id="submitText">ส่งข้อมูล</span>
        </button>

      </form>


      <footer class="form-footer">
        Union Thai-Nichiban Co., Ltd.
      </footer>

    </section>

  </main>


  <!-- =================================
       Popup แจ้งผล / กำลังส่งข้อมูล
  ================================== -->
  <div
    id="status"
    class="status"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="popupTitle"
    aria-describedby="popupMessage"
    aria-hidden="true"
    hidden
  >

    <div class="popup-card">

      <div
        id="popupIcon"
        class="popup-icon"
        aria-hidden="true"
      >✓</div>

      <h2 id="popupTitle">แจ้งเตือน</h2>

      <p id="popupMessage"></p>

      <!-- แสดงระหว่างส่งข้อมูล -->
      <div
        id="loadingIndicator"
        class="loading-indicator"
        hidden
        aria-label="กำลังส่งข้อมูล"
      >
        <span class="loading-spinner"></span>
      </div>

      <button
        type="button"
        id="popupClose"
        class="popup-close"
      >
        ตกลง
      </button>

    </div>

  </div>


  <!-- JavaScript -->
  <script src="./script.js"></script>

</body>
</html>
